name: TradeOS TestFlight release

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App version shown in App Store Connect
        required: true
        default: '1.0'
      build_number:
        description: Optional numeric build number; defaults to workflow run number
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-testflight.yml'
      - 'capacitor.config.json'
      - 'mobile/**'
      - 'scripts/prepare-mobile.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: tradeos-testflight-release
  cancel-in-progress: false

env:
  APP_BUNDLE_ID: uk.co.benjaminchurchill.fieldservice
  APPLE_TEAM_ID: 622C977A6X
  APP_STORE_CONNECT_KEY_ID: KF4BS44LY2
  APP_STORE_CONNECT_ISSUER_ID: 2b2759f4-ea81-4a20-94a7-2548bc9d889b

jobs:
  archive-and-upload:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Apple release secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo 'Missing required GitHub Actions secret: APP_STORE_CONNECT_PRIVATE_KEY' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare native iOS project
        run: |
          npm run mobile:prepare
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Declare exempt encryption usage
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST='ios/App/App/Info.plist'
          test -f "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Set :ITSAppUsesNonExemptEncryption false' "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$INFO_PLIST")" = 'false'

      - name: Verify release bundle before signing
        shell: bash
        run: |
          set -euo pipefail
          test -f mobile-web/privacy.html
          test -f mobile-web/app/index.html
          test -f mobile-web/app/account-privacy-v1.js
          grep -q 'request_account_deletion' mobile-web/app/account-privacy-v1.js
          grep -q 'buy.stripe.com' mobile-web/app/mobile-native.js
          grep -q 'data-tradeos-billing' mobile-web/app/mobile-native.js
          grep -Eq '"appStartPath"[[:space:]]*:[[:space:]]*"app/index.html"' capacitor.config.json
          grep -Eq '"appStartPath"[[:space:]]*:[[:space:]]*"app/index.html"' ios/App/App/capacitor.config.json
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${APP_BUNDLE_ID};" ios/App/App.xcodeproj/project.pbxproj

      - name: Install App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          grep -q 'END PRIVATE KEY' "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.marketing_version }}'
          BUILD='${{ inputs.build_number }}'
          if [ -z "$VERSION" ]; then VERSION='1.0'; fi
          if [ -z "$BUILD" ]; then BUILD="$GITHUB_RUN_NUMBER"; fi
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo 'Build number must be numeric.' >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]; then
            echo 'Marketing version must look like 1.0 or 1.0.0.' >&2
            exit 1
          fi
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

      - name: Archive unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TradeOS.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive

      - name: Export App Store IPA with Apple cloud signing
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/TradeOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Validate with App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
