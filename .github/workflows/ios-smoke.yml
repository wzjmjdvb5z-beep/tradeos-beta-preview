name: TradeOS iOS smoke build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloud/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-smoke.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'cloud/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled TradeOS web app
        run: npm run mobile:prepare

      - name: Generate iOS project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
