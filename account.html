<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>TradeOS Account</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;padding:28px 16px}.brand{font-size:34px;font-weight:950}.brand b,.green{color:#43dda8}.muted{color:#94a6be}.card{background:#111c30;border:1px solid #243653;border-radius:18px;padding:16px;margin:16px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab,.btn{border:0;border-radius:12px;padding:14px;font:inherit;font-weight:850}.tab{background:#1c2b42;color:#fff}.tab.active,.btn{background:#43dda8;color:#062117}.btn{width:100%;margin-top:8px}button:disabled{opacity:.55}input{width:100%;background:#0b1627;color:#fff;border:1px solid #314662;border-radius:11px;padding:13px;margin:6px 0 12px;font:inherit}.label{font-size:12px;color:#94a6be}.msg{display:none;border-radius:12px;padding:12px;margin-top:12px;white-space:pre-wrap}.ok{background:#102c2a;border:1px solid #2b8068}.err{background:#321b20;border:1px solid #8b3d49;color:#ffd8de}.back{color:#43dda8;text-decoration:none}.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<a class="back" href="./">← Back to TradeOS</a>
<div class="brand">Trade<b>OS</b></div><p class="muted">Your TradeOS account</p>
<div id="authCard" class="card">
<div class="tabs"><button id="signupTab" class="tab active" type="button">Create account</button><button id="loginTab" class="tab" type="button">Sign in</button></div>
<form id="signupForm"><h2>Create your account</h2><div class="label">Name</div><input id="signupName" required autocomplete="name" placeholder="Your name"><div class="label">Email</div><input id="signupEmail" type="email" required autocomplete="email" placeholder="you@example.com"><div class="label">Password</div><input id="signupPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><button id="signupButton" class="btn" type="submit">Create account</button></form>
<form id="loginForm" class="hidden"><h2>Sign in</h2><div class="label">Email</div><input id="loginEmail" type="email" required autocomplete="email"><div class="label">Password</div><input id="loginPassword" type="password" required autocomplete="current-password"><button id="loginButton" class="btn" type="submit">Sign in</button></form>
<div id="ok" class="msg ok"></div><div id="err" class="msg err"></div>
</div>
<div id="userCard" class="card hidden"><div class="green"><strong>✓ Signed in</strong></div><h2 id="userName">TradeOS account</h2><p id="userEmail" class="muted"></p><a class="btn" style="text-decoration:none;text-align:center;display:block" href="./">Open TradeOS beta</a><button id="signout" class="btn" style="background:#1c2b42;color:#fff">Sign out</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const URL='https://nynssdxfmjfqgodgynnu.supabase.co';
const KEY='sb_publishable_ose18MeKd0ZPfTM1tbq2fg_hzfVcTxf';
const $=id=>document.getElementById(id),authCard=$('authCard'),userCard=$('userCard'),ok=$('ok'),err=$('err');
function message(text,isError=false){ok.style.display='none';err.style.display='none';const el=isError?err:ok;el.textContent=text;el.style.display='block';el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function mode(which){$('signupForm').classList.toggle('hidden',which!=='signup');$('loginForm').classList.toggle('hidden',which!=='login');$('signupTab').classList.toggle('active',which==='signup');$('loginTab').classList.toggle('active',which==='login');ok.style.display=err.style.display='none'}
function render(session){if(!session)return;authCard.classList.add('hidden');userCard.classList.remove('hidden');$('userEmail').textContent=session.user.email||'';$('userName').textContent=session.user.user_metadata?.name||'TradeOS account'}
let client;
try{
 if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Supabase library failed to load. Refresh the page and try again.');
 client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}catch(e){message('Setup error: '+(e.message||e),true)}
$('signupTab').addEventListener('click',()=>mode('signup'));$('loginTab').addEventListener('click',()=>mode('login'));
$('signupForm').addEventListener('submit',async e=>{
 e.preventDefault(); if(!client)return message('Supabase connection is not ready. Refresh this page.',true);
 const btn=$('signupButton');btn.disabled=true;btn.textContent='Creating account…';message('Contacting TradeOS…');
 try{
  const email=$('signupEmail').value.trim(),password=$('signupPassword').value,name=$('signupName').value.trim();
  const {data,error}=await client.auth.signUp({email,password,options:{data:{name},emailRedirectTo:location.origin+location.pathname}});
  if(error)throw error;
  if(data&&data.session){message('Account created — you are signed in.');render(data.session)}
  else message('Account created. Email confirmation is currently required. Check your inbox, then return here to sign in.');
 }catch(e){message('Signup failed: '+(e?.message||String(e)),true)}finally{btn.disabled=false;btn.textContent='Create account'}
});
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!client)return message('Supabase connection is not ready. Refresh this page.',true);
 const btn=$('loginButton');btn.disabled=true;btn.textContent='Signing in…';message('Signing in…');
 try{const {data,error}=await client.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)throw error;if(!data.session)throw new Error('No session returned.');render(data.session)}catch(e){message('Sign in failed: '+(e?.message||String(e)),true)}finally{btn.disabled=false;btn.textContent='Sign in'}
});
$('signout').addEventListener('click',async()=>{if(client)await client.auth.signOut();authCard.classList.remove('hidden');userCard.classList.add('hidden');mode('login');message('Signed out.')});
if(client){client.auth.getSession().then(({data,error})=>{if(error)message('Session check failed: '+error.message,true);else render(data.session)}).catch(e=>message('Session check failed: '+e.message,true));client.auth.onAuthStateChange((_event,session)=>{if(session)render(session)})}
</script>
</body>
</html>
