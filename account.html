<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>TradeOS Account</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;padding:28px 16px}.brand{font-size:34px;font-weight:950}.brand b,.green{color:#43dda8}.muted{color:#94a6be}.card{background:#111c30;border:1px solid #243653;border-radius:18px;padding:16px;margin:16px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab,.btn{border:0;border-radius:12px;padding:14px;font:inherit;font-weight:850}.tab{background:#1c2b42;color:#fff}.tab.active,.btn{background:#43dda8;color:#062117}.btn{width:100%;margin-top:8px}button:disabled{opacity:.55}input{width:100%;background:#0b1627;color:#fff;border:1px solid #314662;border-radius:11px;padding:13px;margin:6px 0 12px;font:inherit}.label{font-size:12px;color:#94a6be}.msg{display:none;border-radius:12px;padding:12px;margin-top:12px;white-space:pre-wrap}.ok{background:#102c2a;border:1px solid #2b8068}.err{background:#321b20;border:1px solid #8b3d49;color:#ffd8de}.back{color:#43dda8;text-decoration:none}.hidden{display:none}</style>
</head><body><div class="app"><a class="back" href="./">← Back to TradeOS</a><div class="brand">Trade<b>OS</b></div><p class="muted">Your TradeOS account</p><div id="authCard" class="card"><div class="tabs"><button id="signupTab" class="tab active" type="button">Create account</button><button id="loginTab" class="tab" type="button">Sign in</button></div><form id="signupForm"><h2>Create your account</h2><div class="label">Name</div><input id="signupName" required autocomplete="name" placeholder="Your name"><div class="label">Email</div><input id="signupEmail" type="email" required autocomplete="email" placeholder="you@example.com"><div class="label">Password</div><input id="signupPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><button id="signupButton" class="btn" type="submit">Create account</button></form><form id="loginForm" class="hidden"><h2>Sign in</h2><div class="label">Email</div><input id="loginEmail" type="email" required autocomplete="email"><div class="label">Password</div><input id="loginPassword" type="password" required autocomplete="current-password"><button id="loginButton" class="btn" type="submit">Sign in</button></form><div id="ok" class="msg ok"></div><div id="err" class="msg err"></div></div><div id="userCard" class="card hidden"><div class="green"><strong>✓ Signed in</strong></div><h2 id="userName">TradeOS account</h2><p id="userEmail" class="muted"></p><a class="btn" style="text-decoration:none;text-align:center;display:block" href="./">Open TradeOS beta</a><button id="signout" class="btn" style="background:#1c2b42;color:#fff">Sign out</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
var URL='https://nynssdxfmjfqgodgynnu.supabase.co';var KEY='sb_publishable_ose18MeKd0ZPfTM1tbq2fg_hzfVcTxf';
function el(id){return document.getElementById(id)}
function message(text,bad){var o=el('ok'),r=el('err');o.style.display='none';r.style.display='none';var x=bad?r:o;x.textContent=text;x.style.display='block'}
function mode(m){el('signupForm').className=m==='signup'?'':'hidden';el('loginForm').className=m==='login'?'':'hidden';el('signupTab').className='tab'+(m==='signup'?' active':'');el('loginTab').className='tab'+(m==='login'?' active':'')}
var client=null;try{client=window.supabase.createClient(URL,KEY)}catch(e){message('Setup error: '+e.message,true)}
el('signupTab').onclick=function(){mode('signup')};el('loginTab').onclick=function(){mode('login')};
el('signupForm').onsubmit=function(e){e.preventDefault();message('Contacting TradeOS…',false);var btn=el('signupButton');btn.disabled=true;btn.textContent='Creating account…';if(!client){message('Supabase failed to load. Refresh and try again.',true);btn.disabled=false;btn.textContent='Create account';return false}client.auth.signUp({email:el('signupEmail').value.trim(),password:el('signupPassword').value,options:{data:{name:el('signupName').value.trim()},emailRedirectTo:window.location.origin+window.location.pathname}}).then(function(res){if(res.error){message('Signup failed: '+res.error.message,true)}else if(res.data&&res.data.session){showUser(res.data.session)}else{message('Account created. Check your email for the confirmation link.',false)}}).catch(function(e){message('Signup failed: '+e.message,true)}).finally(function(){btn.disabled=false;btn.textContent='Create account'});return false};
el('loginForm').onsubmit=function(e){e.preventDefault();message('Signing in…',false);var btn=el('loginButton');btn.disabled=true;if(!client){message('Supabase failed to load.',true);btn.disabled=false;return false}client.auth.signInWithPassword({email:el('loginEmail').value.trim(),password:el('loginPassword').value}).then(function(res){if(res.error)message('Sign in failed: '+res.error.message,true);else showUser(res.data.session)}).catch(function(e){message('Sign in failed: '+e.message,true)}).finally(function(){btn.disabled=false});return false};
function showUser(s){if(!s)return;el('authCard').className='card hidden';el('userCard').className='card';el('userEmail').textContent=s.user.email||'';el('userName').textContent=(s.user.user_metadata&&s.user.user_metadata.name)||'TradeOS account'}
el('signout').onclick=function(){if(client)client.auth.signOut();el('authCard').className='card';el('userCard').className='card hidden';mode('login')};if(client)client.auth.getSession().then(function(r){if(r.data&&r.data.session)showUser(r.data.session)})
})();
</script></body></html>
