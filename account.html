<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>TradeOS Account</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;padding:28px 16px}.brand{font-size:34px;font-weight:950}.brand b,.green{color:#43dda8}.muted{color:#94a6be}.card{background:#111c30;border:1px solid #243653;border-radius:18px;padding:16px;margin:16px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab,.btn{border:0;border-radius:12px;padding:14px;font:inherit;font-weight:850}.tab{background:#1c2b42;color:#fff}.tab.active,.btn{background:#43dda8;color:#062117}.btn{width:100%;margin-top:8px}button:disabled{opacity:.55}input{width:100%;background:#0b1627;color:#fff;border:1px solid #314662;border-radius:11px;padding:13px;margin:6px 0 12px;font:inherit}.label{font-size:12px;color:#94a6be}.msg{display:none;border-radius:12px;padding:12px;margin-top:12px;white-space:pre-wrap}.ok{background:#102c2a;border:1px solid #2b8068}.err{background:#321b20;border:1px solid #8b3d49;color:#ffd8de}.back{color:#43dda8;text-decoration:none}.hidden{display:none}</style>
</head>
<body>
<div class="app">
<a class="back" href="./">← Back to TradeOS</a>
<div class="brand">Trade<b>OS</b></div>
<p class="muted">Your TradeOS account</p>
<div id="authCard" class="card">
<div class="tabs"><button id="signupTab" class="tab active" type="button">Create account</button><button id="loginTab" class="tab" type="button">Sign in</button></div>
<form id="signupForm"><h2>Create your account</h2><div class="label">Name</div><input id="signupName" required autocomplete="name" placeholder="Your name"><div class="label">Email</div><input id="signupEmail" type="email" required autocomplete="email" placeholder="you@example.com"><div class="label">Password</div><input id="signupPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><button id="signupButton" class="btn" type="submit">Create account</button></form>
<form id="loginForm" class="hidden"><h2>Sign in</h2><div class="label">Email</div><input id="loginEmail" type="email" required autocomplete="email"><div class="label">Password</div><input id="loginPassword" type="password" required autocomplete="current-password"><button id="loginButton" class="btn" type="submit">Sign in</button></form>
<div id="ok" class="msg ok"></div><div id="err" class="msg err"></div>
</div>
<div id="userCard" class="card hidden"><div class="green"><strong>✓ Signed in</strong></div><h2 id="userName">TradeOS account</h2><p id="userEmail" class="muted"></p><a class="btn" style="text-decoration:none;text-align:center;display:block" href="./">Open TradeOS beta</a><button id="signout" class="btn" style="background:#1c2b42;color:#fff">Sign out</button></div>
</div>
<script>
(function(){
var URL='https://nynssdxfmjfqgodgynnu.supabase.co';
var KEY='sb_publishable_ose18MeKd0ZPfTM1tbq2fg_hzfVcTxf';
var SESSION_KEY='tradeos_beta_session';
function el(id){return document.getElementById(id)}
function message(text,bad){var o=el('ok'),r=el('err');o.style.display='none';r.style.display='none';var x=bad?r:o;x.textContent=text;x.style.display='block'}
function mode(m){el('signupForm').className=m==='signup'?'':'hidden';el('loginForm').className=m==='login'?'':'hidden';el('signupTab').className='tab'+(m==='signup'?' active':'');el('loginTab').className='tab'+(m==='login'?' active':'')}
function headers(token){var h={'apikey':KEY,'Content-Type':'application/json'};h.Authorization='Bearer '+(token||KEY);return h}
function request(path,opts){opts=opts||{};opts.headers=opts.headers||headers();return fetch(URL+path,opts).then(function(r){return r.text().then(function(t){var d={};try{d=t?JSON.parse(t):{}}catch(e){d={message:t||('HTTP '+r.status)}}if(!r.ok){var msg=d.msg||d.message||d.error_description||d.error||('HTTP '+r.status);throw new Error(msg)}return d})})}
function saveSession(s){try{localStorage.setItem(SESSION_KEY,JSON.stringify(s))}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}}
function storedSession(){try{var s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');if(s&&s.expires_at&&Date.now()/1000>s.expires_at){clearSession();return null}return s}catch(e){return null}}
function showUser(s){if(!s||!s.user)return;el('authCard').className='card hidden';el('userCard').className='card';el('userEmail').textContent=s.user.email||'';el('userName').textContent=(s.user.user_metadata&&s.user.user_metadata.name)||'TradeOS account';saveSession(s)}
function normaliseSession(d){if(!d||!d.access_token||!d.user)return null;if(!d.expires_at&&d.expires_in)d.expires_at=Math.floor(Date.now()/1000)+d.expires_in;return d}
el('signupTab').onclick=function(){mode('signup')};
el('loginTab').onclick=function(){mode('login')};
el('signupForm').onsubmit=function(e){e.preventDefault();var btn=el('signupButton');btn.disabled=true;btn.textContent='Creating account…';message('Contacting TradeOS…',false);var payload={email:el('signupEmail').value.trim(),password:el('signupPassword').value,data:{name:el('signupName').value.trim()}};request('/auth/v1/signup',{method:'POST',headers:headers(),body:JSON.stringify(payload)}).then(function(d){var s=normaliseSession(d);if(s){showUser(s)}else{message('Account created. Check your email for the confirmation link, then return here to sign in.',false)}}).catch(function(err){message('Signup failed: '+err.message,true)}).then(function(){btn.disabled=false;btn.textContent='Create account'});return false};
el('loginForm').onsubmit=function(e){e.preventDefault();var btn=el('loginButton');btn.disabled=true;btn.textContent='Signing in…';message('Signing in…',false);var payload={email:el('loginEmail').value.trim(),password:el('loginPassword').value};request('/auth/v1/token?grant_type=password',{method:'POST',headers:headers(),body:JSON.stringify(payload)}).then(function(d){var s=normaliseSession(d);if(!s)throw new Error('No session returned');showUser(s)}).catch(function(err){message('Sign in failed: '+err.message,true)}).then(function(){btn.disabled=false;btn.textContent='Sign in'});return false};
el('signout').onclick=function(){var s=storedSession();if(s&&s.access_token){request('/auth/v1/logout',{method:'POST',headers:headers(s.access_token)}).catch(function(){})}clearSession();el('authCard').className='card';el('userCard').className='card hidden';mode('login');message('Signed out.',false)};
var s=storedSession();if(s)showUser(s);
})();
</script>
</body>
</html>
